<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="student.js"></script>
  </head>
  <body>
    <form onsubmit="handleSubmit(event)">
      <label>Student Name:</label>
 
      <input type="text" id="studentName" name="studentName" />
      <div id="errorStudentName" style="color: red; display: none">
        Enter Student Name
      </div>
      <br />
      <label>Sex:</label>
 
      <input type="radio" id="male" name="sex" value="male" />
      <label>Male</label>
 
      <input type="radio" id="female" name="sex" value="female" />
      <label>Female</label>
      <div id="errorSex" style="color: red; display: none">Select Sex</div>
      <br />
      <label>Address:</label>
      <textarea type="textarea" id="address" name="address"></textarea>
      <div id="errorAddress" style="color: red; display: none">
        Enter Address
      </div>
      <br />
      <label>Course:</label>
      <select id="course" name="course">
        <option value="">Select Course</option>
        <option value="bca">BCA</option>
        <option value="csc">CSC</option>
        <option value="eee">EEE</option>
        <option value="ece">ECE</option>
      </select>
      <div id="errorCourse" style="color: red; display: none">
        Select Course
      </div>
      <br />
      <label>Hobbies:</label>
      <input type="checkbox" id="hobby1" name="hobby" value="reading" />
      <label for="hobby1">Reading</label>
 
      <input type="checkbox" id="hobby2" name="hobby" value="traveling" />
      <label for="hobby2">Traveling</label>
 
      <input type="checkbox" id="hobby3" name="hobby" value="sports" />
      <label for="hobby3">Sports</label>
      <div id="errorHobbies" style="color: red; display: none">
        Select at least one hobby
      </div>
      <br />
      <label>Date of Birth:</label>
      <input type="date" id="dob" name="dob" />
      <div id="errorDob" style="color: red; display: none">
        Enter Date of Birth
      </div>
      <br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
